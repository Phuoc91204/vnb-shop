<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thanh toán đơn hàng | VNB Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="checkout">
    <div id="header"></div>

    <main class="wrap">
      <div class="breadcrumb" style="margin-top: 18px">
        <a href="index.html">Trang chủ</a> / <a href="cart.html">Giỏ hàng</a> /
        <span>Thanh toán</span>
      </div>

      <!-- Checkout Steps -->
      <div class="checkout-steps">
        <div class="step completed">
          <span class="step-num">✓</span>
          <span class="step-name">Giỏ hàng</span>
        </div>
        <div class="step-divider active"></div>
        <div class="step active">
          <span class="step-num">2</span>
          <span class="step-name">Thông tin giao hàng</span>
        </div>
        <div class="step-divider"></div>
        <div class="step">
          <span class="step-num">3</span>
          <span class="step-name">Hoàn tất</span>
        </div>
      </div>

      <div class="cart-page-header">
        <h1 class="page-main-title">Thanh Toán Đơn Hàng</h1>
        <p class="page-main-subtitle">
          Vui lòng kiểm tra địa chỉ và phương thức nhận hàng thuận tiện nhất
        </p>
      </div>

      <div id="checkoutContent"></div>
    </main>

    <div id="footer"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
