<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng nhập tài khoản | VNB Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth" class="auth-page-bg">
    <div id="header"></div>

    <main class="wrap auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <img src="img/logovnb.svg" alt="VNB Sports" class="auth-logo" />
          <h2>ĐĂNG NHẬP</h2>
          <p class="auth-subtitle">Chào mừng bạn quay trở lại với VNB Sports</p>
        </div>

        <form id="authForm" data-type="login" novalidate>
          <div class="field">
            <label>Địa chỉ Email (*)</label>
            <input name="email" type="email" placeholder="Ví dụ: admin@vnb.com" />
            <span class="err"></span>
          </div>

          <div class="field">
            <label>Mật khẩu (*)</label>
            <input name="password" type="password" placeholder="Nhập mật khẩu..." />
            <span class="err"></span>
          </div>

          <div id="authMsg" class="auth-alert-err"></div>

          <button type="submit" class="btn btn-auth-submit">ĐĂNG NHẬP NGAY</button>

          <p class="auth-switch-text">
            Chưa có tài khoản? <a href="register.html" id="sw">Đăng ký thành viên mới</a>
          </p>

          <!-- Nút hỗ trợ chấm bài điền nhanh tài khoản -->
          <div class="demo-box">
            <div class="demo-box-head">
              <span><b>Tài khoản thử nghiệm có sẵn:</b></span>
              <button type="button" class="btn-quick-fill" id="btnFillDemo">Điền nhanh</button>
            </div>
            <p>Email: <code>admin@vnb.com</code> | Pass: <code>123456</code></p>
          </div>
        </form>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const l = document.getElementById("sw");
        if (l) l.href += location.search;

        const btnFill = document.getElementById("btnFillDemo");
        if (btnFill) {
          btnFill.onclick = () => {
            const form = document.getElementById("authForm");
            if (form) {
              form.email.value = "admin@vnb.com";
              form.password.value = "123456";
            }
          };
        }
      });
    </script>

    <div id="footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
