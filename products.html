<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sản Phẩm Cầu Lông | VNB Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="list">
    <div id="header"></div>

    <main class="wrap">
      <div class="breadcrumb" style="margin-top: 16px">
        <a href="index.html">Trang chủ</a> / <span>Danh sách sản phẩm</span>
      </div>

      <div class="layout">
        <!-- Sidebar bộ lọc -->
        <aside class="side" id="filters"></aside>

        <!-- Danh sách sản phẩm -->
        <section class="products-main">
          <div class="bar">
            <div class="bar-left">
              <h1 id="list-title" class="page-list-title">Tất cả sản phẩm</h1>
              <span id="count" class="count-badge"></span>
            </div>
            <div class="sort-wrap">
              <label for="sort">Sắp xếp:</label>
              <div class="select-styled">
                <select id="sort" aria-label="Sắp xếp sản phẩm">
                  <option value="">Mặc định</option>
                  <option value="asc">Giá: Thấp → Cao</option>
                  <option value="desc">Giá: Cao → Thấp</option>
                  <option value="name_asc">Tên: A → Z</option>
                  <option value="name_desc">Tên: Z → A</option>
                </select>
              </div>
            </div>
          </div>

          <div class="grid" id="list"></div>
          <!-- Vùng tương thích với huongdanasm2 -->
          <div id="products-list" style="display: none"></div>
        </section>
      </div>
    </main>

    <div id="footer"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
